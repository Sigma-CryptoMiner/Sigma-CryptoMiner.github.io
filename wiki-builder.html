<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repentance Plus Wiki - Master Compiler</title>
<style>
:root { --bg-color:#110814; --text-color:#e2daf0; --sidebar-bg:#1e1024; --card-bg:rgba(36,20,43,0.9); --accent-color:#7b2cbf; --border-color:#4a255c; --input-bg:#0b040e; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background-color:var(--bg-color); background-image:radial-gradient(circle,#251230 10%,#110814 90%); color:var(--text-color); display:flex; height:100vh; overflow:hidden; }
aside { width:450px; background-color:var(--sidebar-bg); padding:20px; border-right:3px solid var(--border-color); display:flex; flex-direction:column; gap:15px; flex-shrink:0; overflow-y:auto; }
h2 { border-bottom:2px solid var(--accent-color); padding-bottom:5px; margin-bottom:5px; font-size:1.1rem; color:#fff; }
p { font-size:0.8rem; opacity:0.8; line-height:1.3; }
input, textarea { width:100%; padding:10px; background-color:var(--input-bg); color:var(--text-color); border:2px solid var(--border-color); border-radius:4px; font-family:inherit; }
textarea { font-family:'Courier New',Courier,monospace; font-size:0.85rem; resize:vertical; }
#wikitextInput { flex-grow:1; min-height:200px; }
#navInput { height:170px; flex-shrink:0; }
.btn-group { display:flex; gap:10px; }
button { flex:1; background-color:var(--accent-color); color:white; border:none; padding:12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.9rem; }
button:hover { opacity:0.9; }
.download-btn { background-color:#38b000; }
main { flex:1; padding:40px; overflow-y:auto; }
.wiki-card { background-color:var(--card-bg); padding:35px; border-radius:8px; border:2px solid var(--border-color); box-shadow:0 4px 15px rgba(0,0,0,0.6); }
.wiki-card img { max-width:100%; height:auto; vertical-align:middle; }
.wiki-card table { width:100%; border-collapse:collapse; margin:20px 0; background:rgba(0,0,0,0.4); border:2px solid var(--border-color); }
.wiki-card td { padding:12px; vertical-align:top; border:1px solid var(--border-color); }
.wiki-card th { background-color:var(--accent-color); color:white; padding:10px; text-align:left; border:1px solid var(--border-color); }
.wiki-card a { color:#d4a5ff; text-decoration:none; font-weight:bold; }
.wiki-card a:hover { text-decoration:underline; color:#fff; }
.wiki-card ul { margin-left:25px; margin-bottom:15px; }
.wiki-card li { margin-bottom:5px; line-height:1.5; }
</style>
</head>
<body>
<aside>
    <h2>Wikitext Master Processor <small style="font-weight:normal;opacity:.7">(v3: dropdowns + icon)</small></h2>
    <p>Convert Fandom syntax and export pages that share one navigation menu.</p>

    <label><b>1. Page Target Identifier (Matches Link Name):</b></label>
    <input type="text" id="pageFileName" placeholder="e.g., collectibles" value="Collectibles">

    <label><b>2. Navigation Menu</b></label>
    <p>One page per line. Indent a line (2 spaces) to put it in a dropdown under the line above it. Use <code>Label | filename</code> if the file name differs from the label.</p>
    <textarea id="navInput" spellcheck="false"></textarea>

    <label><b>3. Paste Fandom Wikitext Source:</b></label>
    <textarea id="wikitextInput" placeholder="Paste wikitext code..."></textarea>

    <div class="btn-group">
        <button type="button" id="previewBtn">Preview Layout</button>
        <button type="button" class="download-btn" id="downloadBtn">Export Page File</button>
    </div>
</aside>
<main><div class="wiki-card" id="outputWorkspace"></div></main>

<script>
// Set to your wiki's Special:FilePath URL (keep the trailing slash).
const IMAGE_BASE = "https://YOUR-WIKI.fandom.com/wiki/Special:FilePath/";

function slug(t) { return t.trim().toLowerCase().replace(/ /g, '_'); }
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function titleCase(s) { return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }

// ---- Navigation storage (localStorage may throw, so everything is guarded) ----
function loadNavText() {
    try {
        const saved = localStorage.getItem('wiki_nav_tree');
        if (saved) return saved;
        const old = JSON.parse(localStorage.getItem('wiki_index_registry'));
        if (Array.isArray(old)) return old.map(f => f === 'index' ? '🏠 Home Portal | index' : titleCase(f) + ' | ' + f).join('\n');
    } catch (e) {}
    return '🏠 Home Portal | index\nCollectibles\nTrinkets';
}
function saveNavText(t) { try { localStorage.setItem('wiki_nav_tree', t); } catch (e) {} }

// ---- Navigation tree ----
function parseNav(text) {
    const root = [], stack = [{ indent: -1, children: root }];
    text.split('\n').forEach(raw => {
        if (!raw.trim()) return;
        const indent = raw.match(/^[ \t]*/)[0].replace(/\t/g, '  ').length;
        const parts = raw.trim().split('|').map(s => s.trim());
        const node = { label: parts[0], file: slug(parts[1] || parts[0]), children: [] };
        while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
        stack[stack.length - 1].children.push(node);
        stack.push({ indent: indent, children: node.children });
    });
    return root;
}
function hasPage(node, file) { return node.file === file || node.children.some(c => hasPage(c, file)); }
function allFiles(nodes) { return nodes.reduce((a, n) => a.concat(n.file, allFiles(n.children)), []); }
function renderNav(nodes, current, cls) {
    return '<ul class="' + cls + '">\n' + nodes.map(n => {
        const link = '<a class="navlink' + (n.file === current ? ' current' : '') + '" href="' + n.file + '.html">' + esc(n.label) + '</a>';
        if (!n.children.length) return '<li>' + link + '</li>';
        return '<li><details class="group"' + (hasPage(n, current) ? ' open' : '') + '><summary>' + link + '</summary>' +
            renderNav(n.children, current, 'sub') + '</details></li>';
    }).join('\n') + '\n</ul>';
}

// ---- Wikitext conversion ----
function compileWikitext(rawText) {
    let src = rawText;
    src = src.replace(/<mainpage-.*?\/>/g, '').replace(/\[\[Category:.*?\]\]/g, '').replace(/<nowiki\/>/g, '');
    src = src.replace(/'''(.*?)'''/g, '<strong>$1</strong>').replace(/''(.*?)''/g, '<em>$1</em>');

    // Images: honor size (480x480px or 150px), alignment (center/left/right) and link=
    src = src.replace(/\[\[File:((?:[^\[\]]|\[\[[^\]]*\]\])*)\]\]/g, (m, inner) => {
        const parts = inner.split('|').map(x => x.trim());
        const file = parts.shift();
        let width = '', align = '', target = '';
        parts.forEach(opt => {
            let mm;
            if ((mm = opt.match(/^(\d+)x(\d+)px$/)) || (mm = opt.match(/^(\d+)px$/))) width = mm[1];
            else if (/^(center|left|right)$/i.test(opt)) align = opt.toLowerCase();
            else if (/^link=/i.test(opt)) target = opt.slice(5).replace(/^\[\[|\]\]$/g, '').trim();
        });
        let img = '<img src="' + IMAGE_BASE + encodeURIComponent(file) + '" alt="' + file + '"' + (width ? ' style="width:' + width + 'px"' : '') + '>';
        if (target) img = '<a href="' + slug(target) + '.html">' + img + '</a>';
        if (align === 'center') return '<div style="text-align:center">' + img + '</div>';
        if (align === 'left' || align === 'right') return '<div style="float:' + align + ';margin:0 12px 12px 12px">' + img + '</div>';
        return img;
    });
    src = src.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (m, t, d) => '<a href="' + slug(t) + '.html">' + d + '</a>');
    src = src.replace(/\[\[([^\]]+)\]\]/g, (m, t) => '<a href="' + slug(t) + '.html">' + t + '</a>');

    // Tables, with nesting support (a stack tracks whether each table has an open row)
    const cell = (tag, s) => {
        s = s.trim();
        if (s.indexOf('|') !== -1) {
            const i = s.indexOf('|');
            return '<' + tag + ' ' + s.slice(0, i).trim() + '>' + s.slice(i + 1).trim() + '</' + tag + '>';
        }
        return '<' + tag + '>' + s + '</' + tag + '>';
    };
    const out = [], rows = [];
    src.split('\n').forEach(raw => {
        const line = raw.trim();
        const top = rows.length - 1;
        if (line.startsWith('{|')) { out.push('<table>'); rows.push(false); }
        else if (line.startsWith('|}') && top >= 0) { out.push((rows.pop() ? '</tr>' : '') + '</table>'); }
        else if (line.startsWith('|-') && top >= 0) { out.push((rows[top] ? '</tr>' : '') + '<tr>'); rows[top] = true; }
        else if (line.startsWith('|+') && top >= 0) { /* caption: ignored */ }
        else if ((line.startsWith('|') || line.startsWith('!')) && top >= 0) {
            const tag = line[0] === '!' ? 'th' : 'td';
            let html = '';
            if (!rows[top]) { html = '<tr>'; rows[top] = true; }
            html += line.substring(1).split(tag === 'th' ? '!!' : '||').map(p => cell(tag, p)).join('');
            out.push(html);
        } else { out.push(raw); }
    });
    while (rows.length) out.push((rows.pop() ? '</tr>' : '') + '</table>');

    // Lists
    const lines = out.join('\n').split('\n');
    let inList = false;
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim().startsWith('*')) {
            lines[i] = (inList ? '' : '<ul>') + '<li>' + lines[i].replace(/^\s*\*\s*/, '') + '</li>';
            inList = true;
        } else if (inList) { lines[i] = '</ul>' + lines[i]; inList = false; }
    }
    if (inList) lines.push('</ul>');
    return lines.join('\n');
}

function processAndPreview() {
    document.getElementById('outputWorkspace').innerHTML = compileWikitext(document.getElementById('wikitextInput').value);
}

// ---- Export ----
const PAGE_CSS = `
:root { --bg-color:#110814; --text-color:#e2daf0; --sidebar-bg:#1e1024; --card-bg:rgba(36,20,43,0.9); --accent-color:#7b2cbf; --border-color:#4a255c; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background-color:var(--bg-color); background-image:radial-gradient(circle,#251230 10%,#110814 90%); color:var(--text-color); display:flex; min-height:100vh; }
aside { width:280px; background-color:var(--sidebar-bg); padding:25px; border-right:3px solid var(--border-color); flex-shrink:0; }
h2 { border-bottom:2px solid var(--accent-color); padding-bottom:5px; margin-bottom:15px; font-size:1.2rem; color:#fff; }
ul.nav, ul.sub { list-style:none; display:flex; flex-direction:column; gap:8px; margin:0; padding:0; }
ul.nav li, ul.sub li { margin:0; }
ul.sub { margin:8px 0 2px 12px; padding-left:10px; border-left:2px solid var(--border-color); gap:6px; }
.navlink { color:var(--text-color); text-decoration:none; display:block; padding:10px; background:rgba(0,0,0,0.3); border-radius:4px; border:1px solid transparent; font-size:0.95rem; font-weight:bold; }
.navlink:hover { border-color:var(--accent-color); background:rgba(0,0,0,0.5); text-decoration:none; color:var(--text-color); }
.navlink.current { border-color:var(--accent-color); background:rgba(123,44,191,0.35); }
details.group > summary { list-style:none; display:flex; align-items:stretch; cursor:pointer; background:rgba(0,0,0,0.3); border:1px solid transparent; border-radius:4px; }
details.group > summary::-webkit-details-marker { display:none; }
details.group > summary:hover { border-color:var(--accent-color); }
details.group > summary .navlink { flex:1; background:none; border:0; }
details.group > summary::after { content:"\\25B8"; padding:10px 14px; color:#d4a5ff; }
details.group[open] > summary::after { content:"\\25BE"; }
summary:focus-visible, .navlink:focus-visible { outline:2px solid #d4a5ff; outline-offset:2px; }
main { flex:1; padding:40px; overflow-y:auto; }
.card { background-color:var(--card-bg); padding:35px; border-radius:8px; border:2px solid var(--border-color); box-shadow:0 4px 15px rgba(0,0,0,0.5); }
table { width:100%; border-collapse:collapse; margin:20px 0; background:rgba(0,0,0,0.4); border:2px solid var(--border-color); }
th, td { border:1px solid var(--border-color); padding:12px; text-align:left; vertical-align:top; }
th { background-color:var(--accent-color); color:white; }
img { max-width:100%; height:auto; vertical-align:middle; }
a { color:#d4a5ff; text-decoration:none; font-weight:bold; }
a:hover { text-decoration:underline; color:#fff; }
ul { margin-left:25px; margin-bottom:15px; }
li { margin-bottom:5px; line-height:1.5; }
@media (max-width:700px) { body { flex-direction:column; } aside { width:100%; border-right:0; border-bottom:3px solid var(--border-color); } }
`;

function downloadCompiledPage() {
    const rawName = document.getElementById('pageFileName').value.trim();
    if (!rawName) { alert("Please type a file destination name first!"); return; }
    const page = slug(rawName);

    const navBox = document.getElementById('navInput');
    let tree = parseNav(navBox.value);
    if (!allFiles(tree).includes(page)) {
        navBox.value = navBox.value.replace(/\s+$/, '') + '\n' + titleCase(page) + ' | ' + page;
        tree = parseNav(navBox.value);
    }
    saveNavText(navBox.value);

    const body = compileWikitext(document.getElementById('wikitextInput').value);
    const html = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n' +
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
        '<title>Repentance Plus Wiki - ' + esc(rawName) + '</title>\n<link rel="icon" href="/favicon.png">\n<style>' + PAGE_CSS + '</style>\n</head>\n<body>\n' +
        '<aside>\n<h2>Wiki Directory</h2>\n' + renderNav(tree, page, 'nav') + '\n</aside>\n' +
        '<main>\n<div class="card">\n' + body + '\n</div>\n</main>\n</body>\n</html>';

    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = page + '.html';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById('previewBtn').addEventListener('click', processAndPreview);
document.getElementById('downloadBtn').addEventListener('click', downloadCompiledPage);
document.getElementById('navInput').addEventListener('input', e => saveNavText(e.target.value));

window.addEventListener('load', function () {
    document.getElementById('navInput').value = loadNavText();
    document.getElementById('wikitextInput').value =
        '<mainpage-leftcolumn-start />\n' +
        '<div style="text-align: center; font-size: x-large; padding: 1em;">\'\'\'Welcome to the Repentance Plus Mod Wiki!\'\'\'</div>\n' +
        '[[File:Logo.png|center|480x480px]]\n\n*59 items\n*23 trinkets\n\n' +
        '{| class="hoverimage" style="text-align:center;" align="center"\n|-\n' +
        '| style="background:transparent;" |[[File:01_collectibles_ordinarylife.png|center|150px|link=[[Collectibles]]]]\n' +
        '| style="background:transparent;" |[[File:02_trinkets_basementkey.png|center|150px|link=[[Trinkets]]]]\n|-\n' +
        '|[[Collectibles]]\n|[[Trinkets]]\n|}';
    processAndPreview();
});
</script>
</body>
</html>
