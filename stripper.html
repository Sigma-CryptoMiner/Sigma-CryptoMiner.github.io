<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki HTML Link Stripper</title>
    <style>
        :root {
            --bg-color: #120c08;
            --text-color: #dfd5c6;
            --card-bg: #3a2e24;
            --accent-color: #b33629;
            --input-bg: #201610;
            --border-color: #534235;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 { border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; margin-bottom: 5px; font-size: 1.5rem; }
        p { font-size: 0.9rem; opacity: 0.8; line-height: 1.4; }
        
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            resize: vertical;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wiki HTML Link Stripper</h1>
        <p>Paste your raw Fandom source markup below. The script strips out the broken external links while fully preserving the inner item titles, allowing you to easily assign your own local page endpoints.</p>
        
        <label><strong>1. Paste Raw Input HTML:</strong></label>
        <textarea id="rawInput" placeholder="Paste your dirty Fandom source code or table HTML here..."></textarea>

        <button onclick="stripLinks()">Strip Links & Format Code</button>

        <label><strong>2. Clean Output HTML:</strong></label>
        <textarea id="cleanOutput" placeholder="Your cleaned HTML will appear here..." readonly></textarea>
    </div>

    <script>
        function stripLinks() {
            const inputData = document.getElementById('rawInput').value;
            if (!inputData.trim()) {
                alert("Please paste some HTML inside the input area first.");
                return;
            }

            // Create a virtual browser sandbox to read the text data strings safely
            const parser = new DOMParser();
            const doc = parser.parseFromString(inputData, 'text/html');

            // Find every link tag across the document structure
            const links = doc.querySelectorAll('a');
            
            links.forEach(link => {
                // Change the hyperlink target destination completely to your placeholder text
                link.setAttribute('href', 'ADD LINK HERE');
            });

            // Extract the cleaned string markup out of our parser environment
            // Using doc.body.innerHTML keeps just the clean inner tags
            let cleanHtml = doc.body.innerHTML;

            // Output the formatted string directly to the secondary preview deck
            document.getElementById('cleanOutput').value = cleanHtml;
        }
    </script>
</body>
</html>
