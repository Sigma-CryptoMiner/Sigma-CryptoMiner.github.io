<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repentance Plus Wiki - index</title>
<link rel="icon" href="/favicon.png">
<style>
:root { --bg-color:#110814; --text-color:#e2daf0; --sidebar-bg:#1e1024; --card-bg:rgba(36,20,43,0.9); --accent-color:#7b2cbf; --border-color:#4a255c; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background-color:var(--bg-color); background-image:radial-gradient(circle,#251230 10%,#110814 90%); color:var(--text-color); display:flex; min-height:100vh; }
aside { width:280px; background-color:var(--sidebar-bg); padding:25px; border-right:3px solid var(--border-color); flex-shrink:0; }
h2 { border-bottom:2px solid var(--accent-color); padding-bottom:5px; margin-bottom:15px; font-size:1.2rem; color:#fff; }
ul.nav, ul.sub { list-style:none; display:flex; flex-direction:column; gap:8px; margin:0; padding:0; }
ul.nav li, ul.sub li { margin:0; }
ul.sub { margin:8px 0 2px 12px; padding-left:10px; border-left:2px solid var(--border-color); gap:6px; }
.navlink { color:var(--text-color); text-decoration:none; display:block; padding:10px; background:rgba(0,0,0,0.3); border-radius:4px; border:1px solid transparent; font-size:0.95rem; font-weight:bold; }
.navlink:hover { border-color:var(--accent-color); background:rgba(0,0,0,0.5); text-decoration:none; color:var(--text-color); }
.navlink.current { border-color:var(--accent-color); background:rgba(123,44,191,0.35); }
details.group > summary { list-style:none; display:flex; align-items:stretch; cursor:pointer; background:rgba(0,0,0,0.3); border:1px solid transparent; border-radius:4px; }
details.group > summary::-webkit-details-marker { display:none; }
details.group > summary:hover { border-color:var(--accent-color); }
details.group > summary .navlink { flex:1; background:none; border:0; }
details.group > summary::after { content:"\25B8"; padding:10px 14px; color:#d4a5ff; }
details.group[open] > summary::after { content:"\25BE"; }
summary:focus-visible, .navlink:focus-visible { outline:2px solid #d4a5ff; outline-offset:2px; }
main { flex:1; padding:40px; overflow-y:auto; }
.card { background-color:var(--card-bg); padding:35px; border-radius:8px; border:2px solid var(--border-color); box-shadow:0 4px 15px rgba(0,0,0,0.5); }
table { width:100%; border-collapse:collapse; margin:20px 0; background:rgba(0,0,0,0.4); border:2px solid var(--border-color); }
th, td { border:1px solid var(--border-color); padding:12px; text-align:left; vertical-align:top; }
th { background-color:var(--accent-color); color:white; }
img { max-width:100%; height:auto; vertical-align:middle; }
a { color:#d4a5ff; text-decoration:none; font-weight:bold; }
a:hover { text-decoration:underline; color:#fff; }
ul { margin-left:25px; margin-bottom:15px; }
li { margin-bottom:5px; line-height:1.5; }
@media (max-width:700px) { body { flex-direction:column; } aside { width:100%; border-right:0; border-bottom:3px solid var(--border-color); } }
</style>
</head>
<body>
